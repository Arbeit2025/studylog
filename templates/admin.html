<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者 · studylog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<main class="wrap"><div class="card">
    <div class="page-header">
        <h1 class="no-margin">管理者</h1>
        <div class="header-actions">
            {% include 'theme_control.html' %}
            <button type="submit" form="studylog-lock" class="auto-width">ロック</button>
        </div>
    </div>
    <p role="status">管理者としてログイン中です。</p>
    <p>学習ログの閲覧・追加・編集・削除に加え、データベース全体のバックアップを取得できます。</p>
    <p>管理者権限は、このブラウザで最大12時間有効です。終了するときは「ロック」を押してください。</p>
    <div class="header-actions">
        <a class="btn-link" href="{{ url_for('index') }}">学習ログへ</a>
        <a class="btn-link" href="{{ url_for('studylog_backup') }}">バックアップをダウンロード</a>
    </div>
    <form method="post" action="{{ url_for('studylog_admin_logout') }}">
        <input type="hidden" name="csrf_token" value="{{ studylog_csrf_token() }}">
        <button type="submit">管理者権限を終了して通常利用へ</button>
    </form>
</div></main>
{% include 'lock.html' %}
</body>
</html>
